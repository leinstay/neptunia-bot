# One instance = one Discord server, one bot account, one personality.
# To run a second character, clone the repository into another directory with
# its own .env, config.local.json, prompts.local/ and data/.
#
#   docker compose up -d --build     first start, or after package.json changed
#   docker compose restart           after `git pull` (code under src/ changed)
#   docker compose logs -f           follow the log (dry-run output lands here)
#
# Prompts and config are hot-reloaded from the mounted directory — editing
# them needs no restart.

services:
  bot:
    build: .
    container_name: neptunia-bot
    restart: unless-stopped
    volumes:
      # The whole project directory, so edits and `git pull` on the host are live and
      # the app reads .env, config.local.json, prompts.local/ and data/ from it…
      - .:/app
      # …except node_modules, which stay the ones installed in the image.
      - /app/node_modules
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
